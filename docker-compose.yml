services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.local
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ADMIN_PORT: "3001"
      PUBLIC_ORIGIN: "http://127.0.0.1:3000"
      ADMIN_ORIGIN: "http://127.0.0.1:3001"
      NODE_ENV: production
    volumes:
      # named volume: bind-mount ./data на macOS даёт SQLite disk I/O error
      - land_data:/app/data
    restart: unless-stopped

volumes:
  land_data:
